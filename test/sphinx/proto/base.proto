syntax = "proto3";
package docs.base;

// Result codes.
enum Result {
   resOk = 0;      // Success.
   resFailed = 1;  // Failure, see @ref Item.kind.
   /*
    * Not supported.
    * @warning Do not rely on it.
    */
   resUnsupported = 2;
}

/*
 * One item.
 * @note Items are small.
 */
message Item {
   enum Kind {
      kindA = 0;  // First kind.
      kindB = 1;  // Second kind.
   }

   // Identifier, see @ref docs.base.device.Config.handle.
   uint32 id = 1;
   Kind kind = 2;  // Kind of the item, @ref kindA or @ref kindB.
   optional Result result = 3;
}
